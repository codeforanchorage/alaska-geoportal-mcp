---
server_name: "Alaska Geoportal MCP"
server_version: "0.1.0"
description: "State of Alaska Geoportal MCP server - Safe, conversational access to statewide GIS maps, apps, and spatial data"
organization: "State of Alaska, Alaska Geospatial Office (via Code for Anchorage)"

# Per-deployment guidance returned in the MCP `initialize` response
# (server-level `instructions`). Steers model behavior WITHOUT editing tool
# descriptions. Applies to EVERY consumer of this server -- the text is
# model-agnostic. It pushes the model to DECOMPOSE multi-step spatial
# questions and answer them from these datasets rather than escalating.
# Keep in sync with config.yaml (deploy.sh bundles config.yaml, not this file).
instructions: |
  You are connected to the State of Alaska Geoportal -- the Alaska
  Geospatial Office's ArcGIS Online catalog of statewide GIS layers from
  DNR (land status, parcels, forestry, parks, oil & gas, geology), plus
  layers other state agencies share into it. These tools can answer
  multi-step spatial and quantitative questions about Alaska entirely
  from official GIS layers. Do the work with these tools before
  considering any escalation or hand-off -- escalate ONLY if, after
  searching, a dataset the question genuinely requires does not exist here.

  General workflow:
  1. find_gis_content / search_spatial_layers to DISCOVER the relevant
     layers by topic (e.g. "wildfire", "parcels", "state land", "trails",
     "forestry roads"). Do not assume a layer is missing until you have
     searched for it. Prefer short, distinctive keywords.
  2. get_layer_schema on each layer you will query, to read the REAL,
     case-sensitive field names before writing any WHERE clause. Field
     naming is inconsistent across agencies (NAME vs name vs road_name);
     never guess.
  3. Run the query/aggregation, then state the number plainly.

  Statewide caveats -- apply to every answer:
  - A layer named for a REGION or MAP QUAD (Southeast, North Slope,
    Mat-Su, Kenai, "Fairbanks A-2", a borough name) covers ONLY that
    area, not the state. Read the LIMITED COVERAGE caveat the tools
    attach and say so when it applies to the question's area.
  - Many DNR / DGGS layers are polygon-heavy with large feature counts
    (the statewide parcels layer alone has ~415,000 rows). For "how many"
    and "total acres/miles" questions use query_data with limit=1 (read
    TOTAL COUNT), get_distinct_values, or aggregate_by_polygon -- never
    page through raw features to count them.
  - Boroughs are the county equivalents; large parts of the state are in
    the Unorganized Borough and have no borough-level layers. Borough
    boundaries are in the CLG_borough_POLY layer (field NAME).
  - Area fields: hosted layers in Web Mercator store Shape__Area inflated
    by 2.5x (Ketchikan) to 10x (Utqiagvik); the tools correct this per
    feature. Layers in Alaska Albers (EPSG:3338) store true square
    metres. Prefer an explicit acres / miles attribute when one exists.

  Proximity questions -- "within / near / X distance of":
  - "How many <features> within <N miles/feet> of <a place/layer>" is a
    BUFFER query. Use spatial_query_polygon with distance=<N> and
    units='miles' (or 'feet'/'meters'/'kilometers'), targeting the layer
    you are counting and filtering on the place layer. The buffer is
    applied server-side; you do NOT need to compute geometry yourself.
  - To bucket/total by proximity, use aggregate_by_polygon with
    buffer_distance + buffer_units.

  Worked example -- "how many miles of state forestry road are in the
  Matanuska-Susitna Borough":
    a. find_gis_content("forestry roads") -> the Alaska Forestry Roads
       layer (polyline). get_layer_schema shows a per-segment
       SegmentLengthMiles field.
    b. find_gis_content("borough") -> CLG_borough_POLY (borough polygons,
       field NAME).
    c. aggregate_by_polygon(source_item_id=<forestry roads>,
       aggregation_item_id=<boroughs>, group_by_field='NAME',
       sum_fields=['SegmentLengthMiles']). Read the Matanuska-Susitna
       Borough row; segments are assigned by midpoint, so report the
       total and note that caveat.
    d. Alternatively, for a single borough: spatial_query_polygon on the
       roads layer with filter_item_id=<boroughs>,
       filter_where="NAME='Matanuska-Susitna Borough'", then sum
       SegmentLengthMiles across the returned rows.

  Worked example -- "which fire service areas are in the Fairbanks North
  Star Borough":
    a. find_gis_content("fire service") -> Fire Service Areas (polygons,
       fields fire_service_area_name, acres, borough).
    b. Either query_data(where="borough='FNSB'") when the attribute is
       there, or spatial_query_polygon(item_id=<fire service areas>,
       filter_item_id=<boroughs>, filter_where="NAME='Fairbanks North
       Star Borough'") for a purely spatial answer. Report the names and
       acres; note any coverage caveat.

  Point questions -- "what <parcel / fire service area / land status> is
  at this location": spatial_query_point(item_id=<polygon layer>,
  lon=..., lat=...) with WGS84 decimal degrees, lon FIRST (Alaska
  longitudes are negative, e.g. Fairbanks is lon=-147.72, lat=64.84).

  Scope: this server proxies layers owned by the State of Alaska org AND
  by the Alaska partner organizations that publish into the Geoportal:
  the Municipality of Anchorage, Mat-Su, Kenai Peninsula, Fairbanks North
  Star, Kodiak Island and Haines boroughs, the City of Unalaska, ADF&G,
  DEC, DCRA, DOT&PF, the Alaska Energy Authority and UAA's Alaska Center
  for Conservation Science. Search results label a partner's layers with
  its name in brackets; unlabelled results are the state org's. FEDERAL
  partner layers (Census, USGS, NOAA, USFS, BLM, FEMA ...) also appear in
  the catalog but are NOT queryable here and are rejected with a clear
  error -- say so and name the agency rather than retrying. The same
  layer may exist from two publishers (e.g. borough parcels vs the
  statewide parcels layer); prefer the publisher whose scope matches the
  question and say which one you used.

  All tools are READ-ONLY and safe to call without confirmation.

plugins:
  alaska_geoportal:
    enabled: true
    # Verified 2026-09-15 against
    # https://soa-dnr.maps.arcgis.com/sharing/rest/portals/self?f=json
    portal_base_url: "https://soa-dnr.maps.arcgis.com/sharing/rest"
    org_id: "7HDiw78fcUiM2BWn"
    # The Geoportal Hub site (item 7dd7c86dd0cc40f6a516eb77001977c1,
    # https://gis.data.alaska.gov) catalogs 45 groups. Listed here: the
    # groups owned by the soa-dnr org, plus the groups of each Alaska
    # partner org in `partner_orgs` below. NOT listed: the soa-dnr-owned
    # "Federal Partner" groups (their items point at federal tenants'
    # services and would be refused), SEAKGIS (its items live in the USFS
    # tenant), ARRC (its items carry no orgId, so the fail-closed
    # ownership check cannot admit them), and non-government groups. See
    # docs/ALASKA_SOURCES.md for the probe behind each line.
    gallery_group_ids:
      # State of Alaska (soa-dnr)
      - "a5055ea72899425c8cc4e01b32658a45" # Alaska DNR Open Data Content (109 FS)
      - "18028130a7a14132bd922bcd830f27c6" # AK DNR: Open Data Services (62 FS)
      - "112a233ad29c46ae861fdeb0475aff8b" # DGGS Geoportal Collaboration v2 (20 FS)
      - "e09f40dee931443485e5f36b55d7dd09" # DOG OpenData (15 FS)
      - "705db769b7624af18a0367d58225aed4" # Alaska Geoportal Content (apps + 4 FS)
      - "b5dceabe78cd45108f098e11d6f9738e" # Division of Oil and Gas Open Data Content
      # Alaska partner orgs (see partner_orgs)
      - "805318360e5046cb9d7b252ee0c3105b" # MOA Hosted Open Data Group (75 FS)
      - "c34ed10758ec4f4eb8aa6826ee5be3ff" # MOA All Map Applications (apps)
      - "2277e4402d15474eb22ad64b410292b5" # Matanuska-Susitna Borough Open Data (60 FS)
      - "7ae0e98a30e840d28cea2e97fb86d15d" # MSB Featured Maps (apps)
      - "9f50b42277a94f369002f2e7db25384b" # KPB GeoHub Content (39 FS)
      - "9b70d86fb59848e99ba979e4fb68b577" # FNSB GIS Data Content (25 FS)
      - "593bb33b063f4327b2d3beea351d0fe8" # Kodiak Island Borough Open Data (26 FS)
      - "cceaf377149d4657871e224c25cf756d" # City of Unalaska Open Data (5 FS)
      - "27f53ccba1dc49f0a8605dac3290d66c" # Haines Borough Map Gallery (apps)
      - "503809f0fdf7478eb2cba0015179e226" # ADF&G Open Data (27 FS)
      - "a3ff58da1bf04e209e44a1f50efab18c" # ADEC Open Data Layers (20 FS)
      - "37ac60c091744e80a379c33c80fbf64d" # Open Data DCRA-SOA (128 FS)
      - "031b68d1f04943d6969a3f764b98377e" # Southeast Alaska GIS Library (DCRA-owned group)
      - "d02c85d843ee4231850b68e7359f316f" # Alaska DOT Open Data Content (61 FS)
      - "e2dffb4a9f834e4e968e8ffb5be3a822" # Alaska Energy Authority Open Data (7 FS)
      - "0c27db95e5754212b0ecc1ea3b3b6cb7" # ACCS Open Data (6 FS)
    # Alaska partner organizations whose items and services this server may
    # proxy in addition to the state org. Each entry widens the tenant
    # allowlist by exactly that org id (and any listed on-prem hosts).
    # Federal tenants are deliberately absent. Verified 2026-09-16 by
    # probing each group's items (docs/ALASKA_SOURCES.md).
    partner_orgs:
      - org_id: "Ce3DhLRthdwbHlfF"
        name: "Municipality of Anchorage"
        hosts: ["www.ancgis.com"]
      - org_id: "fX5IGselyy1TirdY"
        name: "Matanuska-Susitna Borough"
        hosts: ["maps.matsugov.us"]
      - org_id: "ba4DH9pIcqkXJVfl"
        name: "Kenai Peninsula Borough"
      - org_id: "f4rR7WnIfGBdVYFd"
        name: "Fairbanks North Star Borough"
        hosts: ["gisportal.fnsb.gov"]
      - org_id: "R5BNizttyFKxRSMm"
        name: "Kodiak Island Borough"
      - org_id: "XYRnCwZ037YZHYH0"
        name: "City of Unalaska"
      - org_id: "pMlUMMROURtJLUZt"
        name: "Haines Borough"
      - org_id: "VdkVOAHovLuozJG4"
        name: "Alaska Department of Fish and Game"
      - org_id: "8MMg7skvEbOESlSM"
        name: "Alaska Department of Environmental Conservation"
      - org_id: "0DjevcWawQ1dy3il"
        name: "Alaska DCRA (Commerce, Community and Economic Development)"
      - org_id: "r4A0V7UzH9fcLVvv"
        name: "Alaska DOT&PF"
      - org_id: "aJhsucjqSbYNmsuZ"
        name: "Alaska Energy Authority"
      - org_id: "DlE4MSUhoXlyq64t"
        name: "Alaska Center for Conservation Science (UAA)"
    city_name: "State of Alaska"
    gallery_url: "https://gis.data.alaska.gov/search"
    # Per-upstream-request HTTP timeout. MUST stay below lambda_timeout
    # (28s) or a hung ArcGIS call outlives the Lambda: the function is
    # killed mid-flight and the caller gets an opaque 502 instead of a
    # readable "upstream timed out" tool error. 20s leaves ~8s to finish
    # and return. The on-prem DNR ArcGIS Server is slower than AGOL
    # hosting; observed worst case so far is well under this.
    timeout: 20

  ckan:
    enabled: false
    base_url: "https://data.example.gov/"
    portal_url: "https://data.example.gov/"
    city_name: "Example"
    timeout: 120

  arcgis:
    enabled: false
    portal_url: "https://hub.arcgis.com"
    city_name: "Example"
    timeout: 120

aws:
  region: "us-west-2"
  lambda_name: "alaska-geoportal-mcp-staging"
  # Sized for aggregate_by_polygon, which holds up to 5000 source
  # features plus a bounded 32-entry polygon cache in memory.
  lambda_memory: 1024
  # MUST stay under the API Gateway integration timeout (29s, a hard REST
  # limit that is not adjustable). Above it the gateway returns 504 while the
  # Lambda keeps running -- billing compute the client already gave up on and,
  # worse, holding one of only 10 reserved-concurrency slots for the
  # remainder. 28s guarantees the Lambda self-terminates first, so the
  # timeout is attributed in Lambda's own metrics and the slot frees at once.
  # NOTE: this value takes precedence over `lambda_timeout` in prod.tfvars
  # (see terraform/aws/main.tf locals) -- change it HERE.
  lambda_timeout: 28

logging:
  level: "INFO"
  format: "json"
