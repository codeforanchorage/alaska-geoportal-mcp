# OpenContext Configuration Template
# ====================================
#
# Copy this file to config.yaml and customize it for your deployment:
#   cp config-example.yaml config.yaml
#
# ⚠️  IMPORTANT: Enable ONLY ONE plugin per fork/deployment
#
# OpenContext enforces: One Fork = One MCP Server
#
# This keeps deployments:
#   ✓ Simple and focused
#   ✓ Independently scalable
#   ✓ Easy to maintain
#
# To deploy multiple MCP servers:
#   1. Fork this repository again
#   2. Configure ONE plugin per fork
#   3. Deploy each fork separately
#
# See docs/ARCHITECTURE.md for details.

---
# Server metadata
server_name: "Your Organization OpenData MCP" # e.g., "Alaska Geoportal MCP"
description: "Your organization's open data MCP server - Safe, conversational access to your open data"
organization: "Your Organization Name" # e.g., "State of Alaska"

# Plugin configuration
# ====================
#
# IMPORTANT: Enable ONLY ONE plugin below
# For additional MCP servers, fork this repository again
#
plugins:
  # Alaska Geoportal (this fork's only plugin; the generic ckan / arcgis
  # plugins of upstream OpenContext are not in this repo). Statewide
  # ArcGIS Online org of the Alaska Geospatial Office (soa-dnr). See
  # config-alaska-geoportal.yaml for the verified, deployable values.
  alaska_geoportal:
    enabled: true
    portal_base_url: "https://soa-dnr.maps.arcgis.com/sharing/rest"
    org_id: "7HDiw78fcUiM2BWn" # from .../sharing/rest/portals/self?f=json
    # One or more ArcGIS group ids (32-char hex) searched as a union.
    gallery_group_ids:
      - "a5055ea72899425c8cc4e01b32658a45"
      - "18028130a7a14132bd922bcd830f27c6"
    # Other ArcGIS Online orgs whose items/services may be proxied. Each
    # entry widens the tenant allowlist by one org id (+ optional on-prem
    # hostnames). List Alaska partner agencies here, never federal tenants.
    partner_orgs:
      - org_id: "fX5IGselyy1TirdY"
        name: "Matanuska-Susitna Borough"
        hosts: ["maps.matsugov.us"]
    city_name: "State of Alaska"
    gallery_url: "https://gis.data.alaska.gov/search"
    timeout: 20 # Must stay below aws.lambda_timeout

  # yamllint disable rule:comments-indentation
  # Custom: Add your own plugins here
  # Example:
  # my_custom_plugin:
  #   enabled: false
  #   custom_config_key: "value"
  #   api_endpoint: "https://api.example.com"
  # yamllint enable rule:comments-indentation

# AWS deployment settings
aws:
  region: "us-west-2" # AWS region for Lambda
  lambda_name: "your-opendata-mcp" # Lambda function name (will be auto-generated if not set)
  lambda_memory: 512 # Lambda memory in MB (128-10240)
  lambda_timeout: 28 # Must stay under the 29s API Gateway integration limit

# Logging configuration
logging:
  level: "INFO" # Log level: DEBUG, INFO, WARNING, ERROR
  format: "json" # Log format: json or text
